[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W estilo, F errores, I imports, B bugs comunes, UP sintaxis moderna,
# S seguridad (bandit), SIM simplificaciones
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# En tests: assert es lo esperado y subprocess se usa con argumentos fijos
"tests/**" = ["S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
